# Builds the documentation site and publishes it with GitLab Pages.
# Requires a runner that can run Docker images.
stages:
  - build
  - deploy

build-docs:
  stage: build
  image: squidfunk/mkdocs-material:latest
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  image: squidfunk/mkdocs-material:latest
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
