name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BankSync.slnx
      - run: dotnet build BankSync.slnx --no-restore -c Release
      - run: dotnet test BankSync.slnx --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  pack:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet pack src/BankSync/BankSync.csproj -c Release -o out /p:Version=${GITHUB_REF_NAME#v}
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: out/*.nupkg
      # To publish to nuget.org, add a NUGET_API_KEY secret and uncomment:
      # - run: dotnet nuget push out/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict --site-dir public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Publishes the documentation site to GitHub Pages on every push to main.
  # Repository settings -> Pages -> Source must be set to "GitHub Actions".
  docs-deploy:
    needs: [docs-build, build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
